# Server mode on the laptop, for the smoke tests (scripts/smoke.mjs): sign-in with
# local accounts and a fake Google, share links, access tokens for MCP, the
# worker container, refresh schedules, backups, email (to a fake mail server whose
# messages the tests read), and the assistant on Claude's API (answered by a
# scripted fake model), behind the proxytest nginx at http://localhost:8088/opsis/.
#
# Run it under its own project name so it gets its own database and volumes:
#   docker compose -p opsis-servertest --env-file .env.servertest \
#     -f compose.yml -f compose.servertest.yml --profile server --profile proxytest up -d --wait
# smoke.mjs writes .env.servertest with fresh random secrets and removes it again.
x-server: &server
  DEPLOY_MODE: server
  AUTH_MODE: full
  MCP_AUTH: token
  JOB_RUNNER: worker
  COMPOSE_PROFILES: server,proxytest
  PUBLIC_BASE_URL: http://localhost:8088/opsis
  TRUSTED_PROXIES: 172.16.0.0/12
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
  GOOGLE_CLIENT_ID: smoke-client
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_ALLOWED_DOMAINS: allowed.test
  GOOGLE_DISCOVERY_URL: http://fake-oidc:9400/.well-known/openid-configuration
  FEATURE_PUBLIC_SHARE_LINKS: "true"
  FEATURE_SCHEDULED_REFRESH: "true"
  FEATURE_BACKUPS: "true"
  FEATURE_EMAIL: "true"
  SMTP_HOST: fake-smtp
  SMTP_PORT: "2525"
  SMTP_SECURITY: none
  SMTP_FROM: Opsis smoke <opsis@smoke.test>
  # Google Sheets against e2e/fake-google.mjs (its token endpoint is plain http).
  GOOGLE_API_BASE_URL: http://fake-google:9700
  OAUTHLIB_INSECURE_TRANSPORT: "1"
  FEATURE_ASSISTANT: "true"
  ASSISTANT_PROVIDER: anthropic
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  ANTHROPIC_BASE_URL: http://fake-llm:9500

services:
  config-check:
    environment: *server
  api:
    environment: *server
  worker:
    environment: *server
  fake-llm:
    image: node:24-bookworm-slim
    command: ["node", "/fake/fake-llm.mjs"]
    volumes:
      - ./e2e/fake-llm.mjs:/fake/fake-llm.mjs:ro
  fake-google:
    image: node:24-bookworm-slim
    command: ["node", "/fake/fake-google.mjs"]
    volumes:
      - ./e2e/fake-google.mjs:/fake/fake-google.mjs:ro
    ports:
      - "127.0.0.1:9700:9700"
  fake-smtp:
    image: node:24-bookworm-slim
    command: ["node", "/fake/fake-smtp.mjs"]
    volumes:
      - ./e2e/fake-smtp.mjs:/fake/fake-smtp.mjs:ro
    ports:
      - "127.0.0.1:9600:9600"
  fake-oidc:
    image: node:24-bookworm-slim
    command: ["node", "/fake/fake-oidc.mjs"]
    environment:
      PUBLIC_URL: http://localhost:9400
      INTERNAL_URL: http://fake-oidc:9400
      CLIENT_ID: smoke-client
      CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./e2e/fake-oidc.mjs:/fake/fake-oidc.mjs:ro
    ports:
      - "127.0.0.1:9400:9400"
