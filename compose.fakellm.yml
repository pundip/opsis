# The smoke tests' settings at the root and the sub-path (scripts/smoke.mjs adds
# this file, then brings your stack back without it): the assistant answers from
# e2e/fake-llm.mjs, a scripted model, instead of Ollama, and refresh schedules and
# backups are on, so their pages are checked too.
services:
  api:
    environment:
      FEATURE_ASSISTANT: "true"
      ASSISTANT_PROVIDER: ollama
      OLLAMA_URL: http://fake-llm:9500
      OLLAMA_MODEL: fake-model
      FEATURE_SCHEDULED_REFRESH: "true"
      FEATURE_BACKUPS: "true"
    depends_on:
      fake-llm:
        condition: service_started
  fake-llm:
    image: node:24-bookworm-slim
    command: ["node", "/fake/fake-llm.mjs"]
    volumes:
      - ./e2e/fake-llm.mjs:/fake/fake-llm.mjs:ro
