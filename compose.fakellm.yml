# The smoke tests' settings at the root and the sub-path (scripts/smoke.mjs adds
# this file, then brings your stack back without it): the assistant answers from
# e2e/fake-llm.mjs, a scripted model, instead of Ollama, Anthropic and OpenAI; refresh schedules and
# backups are on, so their pages are checked too; and Google Sheets talks to
# e2e/fake-google.mjs, a stand-in for Google's sign-in, Sheets and Drive.
services:
  api:
    environment:
      FEATURE_ASSISTANT: "true"
      ASSISTANT_PROVIDER: ollama
      OLLAMA_URL: http://fake-llm:9500
      OLLAMA_MODEL: fake-model
      # People's own Anthropic and OpenAI keys reach the fake too (any key but "bad" works).
      ANTHROPIC_BASE_URL: http://fake-llm:9500
      OPENAI_BASE_URL: http://fake-llm:9500/v1
      FEATURE_SCHEDULED_REFRESH: "true"
      FEATURE_BACKUPS: "true"
      # Google Sheets against e2e/fake-google.mjs (its token endpoint is plain http).
      GOOGLE_API_BASE_URL: http://fake-google:9700
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    depends_on:
      fake-llm:
        condition: service_started
      fake-google:
        condition: service_started
  fake-llm:
    image: node:24-bookworm-slim
    command: ["node", "/fake/fake-llm.mjs"]
    volumes:
      - ./e2e/fake-llm.mjs:/fake/fake-llm.mjs:ro
  fake-google:
    image: node:24-bookworm-slim
    command: ["node", "/fake/fake-google.mjs"]
    volumes:
      - ./e2e/fake-google.mjs:/fake/fake-google.mjs:ro
    ports:
      - "127.0.0.1:9700:9700"
