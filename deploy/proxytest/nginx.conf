# Laptop stand-in for the production reverse proxy (brief 3.1).
# Serves "another app" at / and Opsis at /opsis, on http://localhost:8088.
# The location block below is the reference for the real proxy: copy it and
# replace api:8080 with <lxc-ip>:8080.

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # Match MAX_UPLOAD_MB in .env (default 200).
    client_max_body_size 200m;

    # Some other app that shares the domain.
    location = / {
        default_type text/html;
        return 200 "<!doctype html><title>Other app</title><h1>Another app on this domain</h1><p>Opsis is at <a href='/opsis/'>/opsis/</a>.</p>";
    }

    location = /opsis {
        return 301 /opsis/;
    }

    location /opsis/ {
        # No URI part after the port, so the /opsis prefix is forwarded unchanged.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming (server-sent events and MCP): no buffering, long read timeout.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
