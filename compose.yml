# Opsis: one Compose file for the laptop and the server.
# Copy .env.local.example or .env.server.example to .env, then: docker compose up -d
# COMPOSE_PROFILES inside .env decides which optional services start:
#   server     worker container (JOB_RUNNER=worker)
#   caddy      bundled reverse proxy with TLS, for installs without their own proxy
#   tunnel     Cloudflare Tunnel
#   ollama     Ollama container
#   proxytest  nginx serving Opsis at http://localhost:8088/opsis/ (laptop test of sub-path hosting)
name: opsis

x-app: &app
  image: opsis/app:${OPSIS_VERSION:-dev}
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - opsisdata:/data
    - backups:/backups
  restart: unless-stopped

services:
  # Runs once and exits. A bad .env fails here, one time, with a clear message:
  #   docker compose logs config-check
  config-check:
    <<: *app
    command: ["check-config"]
    restart: "no"
    volumes: []

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.local.example or .env.server.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opsis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: ["api"]
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      # Laptop: 127.0.0.1. Server: the LXC's LAN IP, reached by your reverse proxy.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-m", "opsis", "healthcheck"] # calls {BASE_PATH}/healthz
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
      start_interval: 2s

  worker:
    <<: *app
    profiles: ["server"]
    command: ["worker"]
    depends_on:
      config-check:
        condition: service_completed_successfully
      api:
        condition: service_healthy # api runs the migrations

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1 # pinned; update deliberately
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Mimics the production reverse proxy on the laptop: another app at /, Opsis at /opsis.
  # Needs PUBLIC_BASE_URL=http://localhost:8088/opsis (see .env.local.example).
  proxytest:
    image: nginx:stable-alpine
    profiles: ["proxytest"]
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/proxytest/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # A small MySQL database with sample data (donors, gifts) to try connections with.
  # Reach it from Opsis at host "sample-mysql", port 3306, database "sample",
  # user "reader", password "reader-sample-pw". Data is rebuilt on every start.
  sample-mysql:
    image: mysql:8.4
    profiles: ["sample", "tools"]
    environment:
      MYSQL_DATABASE: sample
      MYSQL_ROOT_PASSWORD: root-sample-pw
    volumes:
      - ./deploy/sample/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -ureader -preader-sample-pw -e 'SELECT 1 FROM sample.gifts LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
  opsisdata:
  backups:
  caddy_data:
  caddy_config:
  ollama:
