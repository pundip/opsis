[project]
name = "opsis"
version = "0.1.0"
description = "Opsis: a self-hosted, AI-native BI platform"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",
    "cryptography>=43",
    "jsonschema>=4.23",
    "python-multipart>=0.0.12",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pymysql>=1.1",
    "openpyxl>=3.1",
    "sqlglot>=25",
    "pyyaml>=6",
    "mcp>=1.12",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    # The in-app assistant: Claude through the official SDK, Ollama over plain HTTP.
    "anthropic>=1.7",
    "httpx2>=1.0",
    # M8: Google Sheets (service account tokens), Salesforce, and refresh schedules.
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "simple-salesforce>=1.12",
    "croniter>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # A real SMTP server for the email tests.
    "aiosmtpd>=1.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["opsis/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # SQL and expected-data literals read better unwrapped

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["opsis"]

[[tool.mypy.overrides]]
module = ["authlib.*", "pyarrow.*", "pymysql.*", "openpyxl.*", "jsonschema.*", "duckdb.*", "yaml.*", "croniter.*", "google_auth_oauthlib.*", "oauthlib.*", "requests_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
